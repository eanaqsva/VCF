<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>VCF Lerntrainer</title><style>
:root{--bg:#f3f6fb;--surface:#fff;--surface2:#f7f9fc;--text:#162033;--muted:#687386;--line:#dfe5ee;--primary:#2563eb;--primary2:#4f7cff;--soft:#eaf1ff;--ok:#1463d6;--oksoft:#e7f0ff;--bad:#d92d20;--badsoft:#fff0ee;--warn:#b54708;--shadow:0 12px 34px rgba(31,50,81,.09);--safe:env(safe-area-inset-bottom,0px)}[data-theme=dark]{--bg:#0f172a;--surface:#172033;--surface2:#202b40;--text:#f4f7fb;--muted:#a8b3c5;--line:#334158;--primary:#67a8ff;--primary2:#8ab9ff;--soft:#19385e;--ok:#67a8ff;--oksoft:#19385e;--bad:#ff8178;--badsoft:#4b2328;--warn:#fcbf49;--shadow:0 16px 40px rgba(0,0,0,.28)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}button,input,select{font:inherit;color:inherit}.app{min-height:100dvh;padding-bottom:calc(24px + var(--safe))}.topbar{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 15px 10px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topinner{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brandIcon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#2563eb,#6c8cff);box-shadow:0 8px 20px #2563eb44}.topActions{display:flex;align-items:center;gap:8px}.iconBtn{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:13px}.timer{color:var(--warn);font-weight:850}.content{max-width:760px;margin:auto;padding:18px 14px}.view{display:none}.view.active{display:block}.hero{position:relative;overflow:hidden;padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,var(--surface),var(--surface2));box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:180px;height:180px;right:-70px;top:-85px;border-radius:50%;background:linear-gradient(145deg,#2563eb33,#7c9cff08)}.eyebrow{font-size:.77rem;letter-spacing:.08em;font-weight:850;color:var(--primary)}h1{margin:7px 0;font-size:clamp(1.55rem,6vw,2rem);line-height:1.15}.muted{color:var(--muted)}.progress{height:11px;border-radius:99px;background:var(--surface2);margin:19px 0 8px;overflow:hidden}.progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:.3s}.progressMeta{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.metric{padding:15px 8px;text-align:center;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.metric b{display:block;font-size:1.35rem}.metric span{font-size:.76rem;color:var(--muted)}.menu{display:grid;gap:10px}.btn{width:100%;min-height:54px;padding:0 15px;border:1px solid var(--line);background:var(--surface);border-radius:16px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px}.btn:active{transform:scale(.99)}.btn.primary{border:0;color:#fff;font-weight:800;justify-content:center;background:linear-gradient(135deg,#2563eb,#537cf5);box-shadow:0 12px 25px #2563eb33}.btn.danger{color:var(--bad)}.settings{display:grid;gap:9px;margin-top:14px}.switch{min-height:54px;padding:0 15px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;align-items:center;justify-content:space-between}.switch input{width:22px;height:22px;accent-color:var(--primary)}.backrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.backBtn{border:0;background:none;color:var(--primary);padding:8px 0}.counter{font-size:.87rem;color:var(--muted)}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.8rem;margin:10px 0 15px}.qgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.qtile{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:850}.qtile.ok{background:var(--oksoft);border-color:var(--ok);color:var(--ok)}.qtile.bad{background:var(--badsoft);border-color:var(--bad);color:var(--bad)}.qtile small{position:absolute;right:4px;top:2px}.quizHeader{display:flex;align-items:center;justify-content:space-between;gap:10px}.markBtn{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:9px 12px}.markBtn.active{color:var(--warn);border-color:var(--warn)}.question{font-size:clamp(1.22rem,5vw,1.7rem);line-height:1.5;letter-spacing:-.01em;margin:16px 0;max-width:48ch}.keyword{background:#fde68a;color:#713f12;padding:.04em .22em;border-radius:.32em;font-weight:850;box-decoration-break:clone;-webkit-box-decoration-break:clone}[data-theme=dark] .keyword{background:#713f12;color:#fef3c7}.hint{font-size:.9rem;color:var(--muted);margin-bottom:12px}.options{display:grid;gap:10px}.option{width:100%;min-height:64px;padding:13px;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:17px;background:var(--surface);line-height:1.5;box-shadow:0 5px 16px rgba(31,50,81,.04)}.option:active{transform:scale(.99)}.letter{display:grid;place-items:center;flex:0 0 35px;height:35px;border-radius:11px;background:var(--surface2);color:var(--primary);font-weight:850}.option.selected{background:var(--soft);border-color:var(--primary)}.option.correct{background:var(--oksoft);border-color:var(--ok);color:var(--ok)}.option.wrong,.option.previous{background:var(--badsoft);border-color:var(--bad);color:var(--bad)}.option.wrong{animation:shake .42s}.previousTag{display:block;font-size:.73rem;font-weight:850;margin-top:5px}@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}.feedback{display:none}.feedback.show{display:grid;gap:12px;margin-top:15px}.learnCard{padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.learnCard h3{margin:0 0 9px;color:var(--primary);font-size:.8rem;letter-spacing:.045em;text-transform:uppercase}.learnCard p{margin:0;line-height:1.72}.learnCard summary{cursor:pointer;color:var(--primary);font-weight:800}.wrongList{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:9px}.wrongList li{padding:11px;border-radius:13px;background:var(--surface2);border-left:4px solid var(--bad)}.wrongList span{display:block;margin-top:5px;color:var(--muted);line-height:1.55}.nextBtn{margin-top:12px}.panel{padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}.form{display:grid;gap:12px}.form label{color:var(--muted);font-size:.88rem}.form select{width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface2)}.result{text-align:center}.score{font-size:2.5rem;font-weight:900;color:var(--primary)}.toast{position:fixed;z-index:40;left:50%;top:calc(74px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);opacity:0;padding:10px 16px;border-radius:99px;color:#fff;font-weight:850;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}@media(max-width:420px){.qgrid{grid-template-columns:repeat(5,1fr)}.metrics{gap:7px}.metric{padding:13px 5px}}
</style></head><body><div class="app"><header class="topbar"><div class="topinner"><div class="brand"><span class="brandIcon">V</span><span>VCF Lerntrainer</span></div><div class="topActions"><span class="timer" id="timer"></span><button class="iconBtn" id="theme">◐</button></div></div></header><main class="content">
<section class="view active" id="home"><div class="hero"><div class="eyebrow">DEIN LERNFORTSCHRITT</div><h1>Bereit für die nächste Runde?</h1><p class="muted" id="homeCopy"></p><div class="progress"><i id="bar"></i></div><div class="progressMeta"><span id="homeDone"></span><b id="homePct"></b></div></div><div class="metrics"><div class="metric"><b id="learned">0</b><span>bearbeitet</span></div><div class="metric"><b id="open">60</b><span>offen</span></div><div class="metric"><b id="rate">0%</b><span>richtig</span></div></div><div class="menu"><button class="btn primary" id="continue">Weiterlernen</button><button class="btn" id="overviewBtn"><span>Alle Fragen ansehen</span><b>›</b></button><button class="btn" id="examBtn"><span>Prüfungsmodus</span><b>›</b></button><button class="btn" id="wrongBtn"><span>Falsche Fragen wiederholen</span><b>›</b></button><button class="btn" id="favoritesBtn"><span>Gemerkte Fragen</span><b>›</b></button></div><div class="settings"><label class="switch"><span>Zufällige Reihenfolge</span><input id="random" type="checkbox"></label><label class="switch"><span>Ausführliche Erklärungen anzeigen</span><input id="showEx" type="checkbox" checked></label><button class="btn danger" id="reset"><span>Fortschritt zurücksetzen</span><b>↺</b></button></div></section>
<section class="view" id="overview"><div class="backrow"><button class="backBtn" data-home>‹ Startmenü</button><span class="counter">Alle 60 Fragen</span></div><h1>Fragenübersicht</h1><div class="legend"><span>○ Offen</span><span style="color:var(--ok)">✓ Richtig</span><span style="color:var(--bad)">✕ Falsch</span></div><div class="qgrid" id="qgrid"></div></section>
<section class="view" id="quiz"><div class="backrow"><button class="backBtn" data-home>‹ Startmenü</button><span class="counter" id="counter"></span></div><div class="quizHeader"><span class="hint" id="modeInfo"></span><button class="markBtn" id="mark">☆ Merken</button></div><h2 class="question" id="question"></h2><div class="hint" id="hint"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="btn primary nextBtn" id="next" style="display:none">Nächste Frage</button></section>
<section class="view" id="examSetup"><div class="backrow"><button class="backBtn" data-home>‹ Startmenü</button></div><div class="panel"><h1>Prüfungsmodus</h1><p class="muted">Während der Prüfung werden Lösungen und Erklärungen nicht angezeigt.</p><div class="form"><label>Anzahl der Fragen<select id="examCount"><option>10</option><option>20</option><option>30</option><option selected>60</option></select></label><label>Zeitlimit<select id="examMinutes"><option value="15">15 Minuten</option><option value="30">30 Minuten</option><option value="60">60 Minuten</option><option value="90" selected>90 Minuten</option></select></label><button class="btn primary" id="startExam">Prüfung starten</button></div></div></section>
<section class="view" id="examResult"><div class="panel result"><h1>Prüfung beendet</h1><div class="score" id="examScore"></div><p class="muted" id="examVerdict"></p><button class="btn primary" id="reviewExam">Falsche Prüfungsfragen wiederholen</button><button class="btn" data-home>Zum Startmenü</button></div></section>
</main></div><div class="toast" id="toast"></div><script src="questions.js"></script><script>
const Q=window.VCF_QUESTIONS,KEY='vcf-v13';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{results:{},last:{},favs:[],order:Q.map((_,i)=>i),pos:0,mode:'learn',showEx:true,random:false,dark:false,exam:null},selected=new Set(),locked=false,tick=null,autoTimer=null;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(S))}function cur(){return Q[S.order[S.pos]]}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function show(id){clearInterval(tick);clearTimeout(autoTimer);$('#timer').textContent='';document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));if(id==='home')home();if(id==='overview')overview();if(id==='quiz')quiz();scrollTo({top:0,behavior:'smooth'})}function summary(){let v=Object.values(S.results),c=v.filter(x=>x==='correct').length;return{done:v.length,open:Q.length-v.length,rate:v.length?Math.round(c/v.length*100):0}}function home(){let x=summary(),pct=Math.round(x.done/Q.length*100);$('#homeCopy').textContent=x.done?`Du hast ${x.done} von ${Q.length} Fragen bearbeitet.`:'Starte mit der ersten Frage oder öffne die Übersicht.';$('#homeDone').textContent=`${x.done} von ${Q.length} bearbeitet`;$('#homePct').textContent=pct+'%';$('#bar').style.width=pct+'%';$('#learned').textContent=x.done;$('#open').textContent=x.open;$('#rate').textContent=x.rate+'%';$('#random').checked=S.random;$('#showEx').checked=S.showEx}function overview(){$('#qgrid').innerHTML=Q.map((q,i)=>{let r=S.results[q.id],cl=r==='correct'?'ok':r==='wrong'?'bad':'',ic=r==='correct'?'✓':r==='wrong'?'✕':'○';return `<button class="qtile ${cl}" data-i="${i}"><small>${ic}</small>${q.id}</button>`}).join('');document.querySelectorAll('.qtile').forEach(b=>b.onclick=()=>{S.order=Q.map((_,i)=>i);S.pos=+b.dataset.i;S.mode='learn';S.exam=null;save();show('quiz')})}const KW=['Choose two','Choose three','Choose four','must','required','prerequisite','before','after','default','minimum','smallest','only','without','RPO','dark site','air-gapped','VCF Installer','SDDC Manager','vSAN','NSX','Kubernetes'];function marked(t){let h=esc(t);[...KW].sort((a,b)=>b.length-a.length).forEach(k=>h=h.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark class="keyword">$1</mark>'));return h}function quiz(){locked=false;selected.clear();let q=cur(),wrong=S.mode==='wrong',fav=S.mode==='favorites';$('#counter').textContent=S.mode==='exam'?`Prüfung ${S.pos+1} von ${S.order.length}`:wrong?`Falsche Frage ${S.pos+1} von ${S.order.length}`:fav?`Gemerkte Frage ${S.pos+1} von ${S.order.length}`:`Frage ${q.id} von ${Q.length}`;$('#modeInfo').textContent=wrong?`Originalfrage ${q.id}`:'';$('#question').innerHTML=marked(q.question);$('#hint').textContent=q.answers.length>1?`${q.answers.length} Antworten auswählen`:'Eine Antwort antippen';let prev=wrong?(S.last[q.id]||[]):[];$('#options').innerHTML=Object.entries(q.options).map(([k,v])=>`<button class="option ${prev.includes(k)?'previous':''}" data-k="${k}"><span class="letter">${k}</span><span>${esc(v)}${prev.includes(k)?'<span class="previousTag">✕ Deine letzte Auswahl</span>':''}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>tap(b));$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#next').style.display='none';$('#mark').textContent=(S.favs.includes(q.id)?'★':'☆')+' Merken';$('#mark').classList.toggle('active',S.favs.includes(q.id));if(S.mode==='exam')startTimer()}function tap(b){if(locked)return;let q=cur(),k=b.dataset.k;if(selected.has(k)){selected.delete(k);b.classList.remove('selected')}else{selected.add(k);b.classList.remove('previous');b.classList.add('selected')}if(selected.size===q.answers.length)grade()}function buildFeedback(q){let wrong=Object.entries(q.wrongReasons||{}).map(([k,v])=>`<li><b>${k}) ${esc(q.options[k])}</b><span>${esc(v)}</span></li>`).join('');$('#feedback').innerHTML=`<section class="learnCard"><h3>✓ Richtige Antwort</h3>${q.answers.map(k=>`<p><b>${k}) ${esc(q.options[k])}</b></p>`).join('')}</section><section class="learnCard"><h3>Warum ist das richtig?</h3><p>${esc(q.deExplanation)}</p></section><section class="learnCard"><h3>🎯 Prüfungstipp</h3><p>${esc(q.examTip)}</p></section><details class="learnCard"><summary>Warum die anderen Antworten falsch sind</summary><ul class="wrongList">${wrong}</ul></details><details class="learnCard"><summary>Englische Originalerklärung</summary><p class="muted">${esc(q.explanation)}</p></details>`;$('#feedback').className='feedback show';$('#next').style.display='flex'}function grade(){locked=true;let q=cur(),chosen=[...selected].sort(),right=[...q.answers].sort(),ok=JSON.stringify(chosen)===JSON.stringify(right);S.last[q.id]=chosen;if(S.mode==='exam'){S.exam.answers[q.id]=chosen;if(ok)S.exam.correct++;else S.exam.wrongIds.push(q.id);save();autoTimer=setTimeout(next,450);return}S.results[q.id]=ok?'correct':'wrong';save();document.querySelectorAll('.option').forEach(b=>{const k=b.dataset.k;b.classList.remove('selected','previous','correct','wrong');if(right.includes(k))b.classList.add('correct');else if(chosen.includes(k))b.classList.add('wrong');b.disabled=true});toast(ok?'✓ Richtig!':'✕ Falsch',ok?'ok':'bad');if(S.showEx)buildFeedback(q);else autoTimer=setTimeout(next,ok?2200:3000)}function next(){if(S.mode==='exam'&&S.pos>=S.order.length-1)return finishExam();S.pos=(S.pos+1)%S.order.length;save();quiz();scrollTo({top:0,behavior:'smooth'})}function toast(text,type){let t=$('#toast');t.textContent=text;t.className='toast show '+type;setTimeout(()=>t.className='toast',1100)}function startList(indices,mode){S.exam=null;S.mode=mode;S.order=S.random?shuffle([...indices]):[...indices];S.pos=0;save();show('quiz')}function startTimer(){let end=S.exam.end;function update(){let left=Math.max(0,end-Date.now()),sec=Math.ceil(left/1000);$('#timer').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(left<=0)finishExam()}update();tick=setInterval(update,1000)}function finishExam(){clearInterval(tick);let e=S.exam,pct=Math.round(e.correct/e.total*100);S.lastExam={score:pct,correct:e.correct,total:e.total,wrongIds:[...new Set(e.wrongIds)]};S.exam=null;S.mode='learn';save();$('#examScore').textContent=pct+'%';$('#examVerdict').textContent=`${e.correct} von ${e.total} richtig. ${pct>=70?'Bestanden':'Nicht bestanden'}.`;$('#reviewExam').style.display=S.lastExam.wrongIds.length?'flex':'none';show('examResult')}$('#continue').onclick=()=>startList(Q.map((_,i)=>i),'learn');$('#overviewBtn').onclick=()=>show('overview');$('#wrongBtn').onclick=()=>{let a=Q.map((q,i)=>S.results[q.id]==='wrong'?i:-1).filter(i=>i>=0);a.length?startList(a,'wrong'):alert('Noch keine falschen Fragen')};$('#favoritesBtn').onclick=()=>{let a=S.favs.map(id=>Q.findIndex(q=>q.id===id)).filter(i=>i>=0);a.length?startList(a,'favorites'):alert('Noch keine Fragen gemerkt')};$('#mark').onclick=()=>{let id=cur().id,i=S.favs.indexOf(id);i<0?S.favs.push(id):S.favs.splice(i,1);save();quiz()};$('#examBtn').onclick=()=>show('examSetup');$('#startExam').onclick=()=>{let total=+$('#examCount').value,mins=+$('#examMinutes').value;S.order=shuffle(Q.map((_,i)=>i)).slice(0,total);S.pos=0;S.mode='exam';S.exam={total,correct:0,wrongIds:[],answers:{},end:Date.now()+mins*60000};save();show('quiz')};$('#reviewExam').onclick=()=>startList(S.lastExam.wrongIds.map(id=>Q.findIndex(q=>q.id===id)),'wrong');$('#random').onchange=e=>{S.random=e.target.checked;save()};$('#showEx').onchange=e=>{S.showEx=e.target.checked;save()};$('#next').onclick=next;$('#reset').onclick=()=>{if(confirm('Wirklich Fortschritt, Merkliste und Prüfungsergebnisse löschen?')){localStorage.removeItem(KEY);location.reload()}};$('#theme').onclick=()=>{S.dark=!S.dark;document.documentElement.dataset.theme=S.dark?'dark':'';save()};document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));document.documentElement.dataset.theme=S.dark?'dark':'';show('home');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
