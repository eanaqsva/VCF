<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>VCF Lerntrainer</title><style>
:root{--bg:#f5f7fa;--s:#fff;--s2:#eef2f7;--t:#172033;--m:#667085;--l:#dfe4ea;--p:#2563eb;--ps:#e8f0ff;--ok:#1463d6;--oks:#e7f0ff;--bad:#d92d20;--bads:#fff0ee;--warn:#b54708;--shadow:0 8px 28px #10182812}[data-theme=dark]{--bg:#111827;--s:#1f2937;--s2:#273449;--t:#f3f4f6;--m:#a7b0bf;--l:#3b4758;--p:#60a5fa;--ps:#1e3a5f;--ok:#67a8ff;--oks:#18385f;--bad:#ff7b72;--bads:#4a2028;--warn:#fdb022;--shadow:0 8px 28px #0005}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit;color:inherit}.head{position:sticky;top:0;z-index:10;background:var(--s);border-bottom:1px solid var(--l);padding:calc(9px + env(safe-area-inset-top,0px)) 14px 9px}.row,.back{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850}.icon,.mark{border:1px solid var(--l);border-radius:13px;background:var(--s)}.icon{width:42px;height:42px}main{max-width:760px;margin:auto;padding:17px 14px 42px}.view{display:none}.view.on{display:block}.card,.metric,.menu button,.option,.panel,.switch,.learnCard{background:var(--s);border:1px solid var(--l);box-shadow:var(--shadow)}.card,.panel{border-radius:20px;padding:18px}.muted,.hint,.counter,.original{color:var(--m)}.progress{height:10px;background:var(--s2);border-radius:99px;margin:16px 0 8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--p)}.progressText{display:flex;justify-content:space-between;color:var(--m)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.metric{text-align:center;border-radius:16px;padding:12px 5px}.metric b{display:block;font-size:1.28rem}.metric span{font-size:.76rem;color:var(--m)}.menu,.settings,.form{display:grid;gap:9px}.menu button,.primary,.switch{min-height:52px;border-radius:15px;padding:0 15px;text-align:left}.primary{border:0!important;background:var(--p)!important;color:#fff;text-align:center!important;font-weight:800}.settings{margin-top:13px}.switch{display:flex;align-items:center;justify-content:space-between}.switch input{width:22px;height:22px}.back{margin-bottom:9px}.back button{border:0;background:none;color:var(--p);padding:8px 0}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.tile{position:relative;aspect-ratio:1;border:1px solid var(--l);border-radius:13px;background:var(--s);font-weight:800}.tile.ok{background:var(--oks);border-color:var(--ok);color:var(--ok)}.tile.no{background:var(--bads);border-color:var(--bad);color:var(--bad)}.tile small{position:absolute;right:4px;top:2px}.quizTop{display:flex;justify-content:space-between;align-items:center}.mark{padding:9px 12px}.mark.active{color:var(--warn);border-color:var(--warn)}h2{font-size:clamp(1.2rem,5vw,1.62rem);line-height:1.52;max-width:46ch}.key{background:#fde68a;color:#713f12;padding:.04em .22em;border-radius:.3em;font-weight:850}[data-theme=dark] .key{background:#713f12;color:#fef3c7}.options{display:grid;gap:10px}.option{min-height:62px;width:100%;display:flex;gap:12px;text-align:left;align-items:flex-start;border-radius:16px;padding:13px;line-height:1.55}.letter{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:10px;background:var(--s2);color:var(--p);font-weight:850}.option.picked{border-color:var(--p);background:var(--ps)}.option.good,.option.reveal{background:var(--oks);border-color:var(--ok);color:var(--ok)}.option.bad,.option.previous{background:var(--bads);border-color:var(--bad);color:var(--bad)}.option.bad{animation:shake .42s}.previousTag{display:block;font-size:.74rem;font-weight:800;margin-top:4px}@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}.feedback{display:none}.feedback.show{display:grid;gap:12px;margin-top:14px}.learnCard{border-radius:16px;padding:14px}.learnCard h3{margin:0 0 9px;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--p)}.learnCard p{margin:0;line-height:1.72}.learnCard summary{cursor:pointer;font-weight:800;color:var(--p)}.wrongList{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:9px}.wrongList li{padding:11px;border-radius:12px;background:var(--s2);border-left:4px solid var(--bad)}.wrongList span{display:block;margin-top:5px;color:var(--m);line-height:1.55}.original{margin-top:10px;line-height:1.72}.status{position:fixed;z-index:30;left:50%;top:80px;transform:translate(-50%,-12px);opacity:0;border-radius:99px;padding:9px 16px;color:#fff;font-weight:850;transition:.2s}.status.show{opacity:1;transform:translate(-50%,0)}.status.ok{background:var(--ok)}.status.no{background:var(--bad)}.next{width:100%;margin-top:12px}.form label{color:var(--m)}.form select{width:100%;margin-top:5px;padding:12px;border-radius:12px;border:1px solid var(--l);background:var(--s2)}.timer{color:var(--warn);font-weight:850}.score{text-align:center;font-size:2.4rem;font-weight:900;color:var(--p)}@media(max-width:420px){.grid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header class="head"><div class="row"><div class="brand">VCF Lerntrainer</div><div><span class="timer" id="timer"></span> <button class="icon" id="theme">◐</button></div></div></header><main>
<section class="view on" id="home"><div class="card"><h1>Bereit für die nächste Runde?</h1><p class="muted" id="copy"></p><div class="progress"><i id="bar"></i></div><div class="progressText"><span id="done"></span><b id="pct"></b></div></div><div class="metrics"><div class="metric"><b id="learned">0</b><span>bearbeitet</span></div><div class="metric"><b id="open">60</b><span>offen</span></div><div class="metric"><b id="rate">0%</b><span>richtig</span></div></div><div class="menu"><button class="primary" id="cont">Weiterlernen</button><button id="all">Alle Fragen ansehen</button><button id="examBtn">Prüfungsmodus</button><button id="wrong">Falsche Fragen wiederholen</button><button id="favorites">Gemerkte Fragen</button><div class="switch"><span>Erklärungen werden nach jeder Antwort immer angezeigt.</span><b>✓</b></div></div><div class="settings"><label class="switch"><span>Zufällige Reihenfolge</span><input type="checkbox" id="random"></label><button class="switch" id="reset"><span>Fortschritt zurücksetzen</span><b>↺</b></button></div></section>
<section class="view" id="overview"><div class="back"><button data-home>‹ Startmenü</button><span class="counter">Alle 60 Fragen</span></div><h1>Fragenübersicht</h1><p class="muted">○ Offen &nbsp; <span style="color:var(--ok)">✓ Richtig</span> &nbsp; <span style="color:var(--bad)">✕ Falsch</span></p><div class="grid" id="grid"></div></section>
<section class="view" id="quiz"><div class="back"><button data-home>‹ Startmenü</button><span class="counter" id="counter"></span></div><div class="quizTop"><span class="hint" id="modeInfo"></span><button class="mark" id="mark">☆ Merken</button></div><h2 id="question"></h2><p class="hint" id="hint"></p><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="primary next" id="next" style="display:none">Nächste Frage</button></section>
<section class="view" id="examSetup"><div class="back"><button data-home>‹ Startmenü</button></div><div class="panel"><h2>Prüfungsmodus</h2><div class="form"><label>Fragen<select id="examCount"><option>10</option><option>20</option><option>30</option><option selected>60</option></select></label><label>Zeitlimit<select id="examTime"><option value="15">15 Minuten</option><option value="30">30 Minuten</option><option value="60">60 Minuten</option><option value="90" selected>90 Minuten</option></select></label><button class="primary" id="startExam">Prüfung starten</button></div></div></section>
<section class="view" id="examResult"><div class="panel"><h2 style="text-align:center">Prüfung beendet</h2><div class="score" id="examScore"></div><p class="muted" style="text-align:center" id="examVerdict"></p><button class="primary next" id="reviewExam">Falsche Prüfungsfragen wiederholen</button><button class="switch next" data-home>Zum Startmenü</button></div></section>
</main><div class="status" id="status"></div><script src="questions.js"></script><script>
const Q=window.VCF_QUESTIONS,K='vcf-full-v10';let S=JSON.parse(localStorage.getItem(K)||'null')||{pos:0,order:Q.map((_,i)=>i),results:{},lastChoices:{},theme:'light',explain:true,random:false,favs:[],exam:null,mode:'learn'},locked=false,picked=new Set(),tick=null,advanceTimer=null;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(S))}function cur(){return Q[S.order[S.pos%S.order.length]]}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function show(id){clearInterval(tick);clearTimeout(advanceTimer);$('#timer').textContent='';document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));if(id==='home')home();if(id==='overview')overview();if(id==='quiz')quiz();scrollTo({top:0,behavior:'smooth'})}function summary(){let v=Object.values(S.results),c=v.filter(x=>x==='correct').length;return{n:v.length,open:Q.length-v.length,rate:v.length?Math.round(c/v.length*100):0}}function home(){let x=summary(),p=Math.round(x.n/Q.length*100);$('#copy').textContent=`${x.n} von ${Q.length} Fragen bearbeitet.`;$('#done').textContent=`${x.n} von ${Q.length} bearbeitet`;$('#pct').textContent=p+'%';$('#bar').style.width=p+'%';$('#learned').textContent=x.n;$('#open').textContent=x.open;$('#rate').textContent=x.rate+'%';$('#random').checked=S.random}function overview(){$('#grid').innerHTML=Q.map((q,i)=>{let x=S.results[q.id],cl=x==='correct'?'ok':x==='wrong'?'no':'',ic=x==='correct'?'✓':x==='wrong'?'✕':'○';return `<button class="tile ${cl}" data-i="${i}"><small>${ic}</small>${q.id}</button>`}).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{S.mode='learn';S.order=Q.map((_,i)=>i);S.pos=+b.dataset.i;save();show('quiz')})}const KWS=['Choose two','Choose three','Choose four','must','required','prerequisite','before','after','default','minimum','smallest','only','without','RPO','dark site','air-gapped','VCF Installer','SDDC Manager','vSAN','NSX','Kubernetes'];function marked(t){let h=esc(t);KWS.sort((a,b)=>b.length-a.length).forEach(k=>h=h.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark class="key">$1</mark>'));return h}function quiz(){locked=false;picked.clear();let q=cur(),w=S.mode==='wrong',f=S.mode==='favorites';$('#counter').textContent=S.mode==='exam'?`Prüfung ${S.pos+1} von ${S.order.length}`:w?`Falsche Frage ${S.pos+1} von ${S.order.length}`:f?`Gemerkte Frage ${S.pos+1} von ${S.order.length}`:`Frage ${q.id} von ${Q.length}`;$('#modeInfo').textContent=w?`Originalfrage ${q.id}`:'';$('#question').innerHTML=marked(q.question);$('#hint').textContent=q.answers.length>1?`${q.answers.length} Antworten auswählen`:'Eine Antwort antippen';let prev=w?(S.lastChoices[q.id]||[]):[];$('#options').innerHTML=Object.entries(q.options).map(([k,v])=>`<button class="option ${prev.includes(k)?'previous':''}" data-k="${k}"><span class="letter">${k}</span><span>${esc(v)}${prev.includes(k)?'<span class="previousTag">✕ Deine letzte Auswahl</span>':''}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>tap(b.dataset.k));$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#next').style.display='none';$('#mark').textContent=(S.favs.includes(q.id)?'★':'☆')+' Merken';$('#mark').classList.toggle('active',S.favs.includes(q.id));if(S.mode==='exam')startTimer()}function tap(k){if(locked)return;let q=cur(),need=q.answers.length,b=document.querySelector(`.option[data-k="${k}"]`);if(picked.has(k)){picked.delete(k);b.classList.remove('picked');return}picked.add(k);b.classList.remove('previous');b.classList.add('picked');if(picked.size===need)evaluate()}function feedback(q){let wrong=Object.entries(q.wrongReasons).map(([k,v])=>`<li><b>${k}) ${esc(q.options[k])}</b><span>${esc(v)}</span></li>`).join('');$('#feedback').innerHTML=`<section class="learnCard"><h3>✓ Richtige Antwort</h3>${q.answers.map(k=>`<p><b>${k}) ${esc(q.options[k])}</b></p>`).join('')}</section><section class="learnCard"><h3>▤ Deutsche Erklärung</h3><p>${esc(q.deExplanation)}</p></section><section class="learnCard"><h3>🎯 Prüfungstipp</h3><p>${esc(q.examTip)}</p></section><details class="learnCard"><summary>Warum die anderen Antworten falsch sind</summary><ul class="wrongList">${wrong}</ul></details><details class="learnCard"><summary>Englische Originalerklärung</summary><div class="original">${esc(q.explanation)}</div></details>`;$('#feedback').className='feedback show';$('#next').style.display='block'}function evaluate(){locked=true;let q=cur(),chosen=[...picked].sort(),right=[...q.answers].sort(),ok=JSON.stringify(chosen)===JSON.stringify(right);S.lastChoices[q.id]=chosen;if(S.mode==='exam'){S.exam.answers[q.id]=chosen;if(ok)S.exam.correct++;else S.exam.wrongIds.push(q.id);save();advanceTimer=setTimeout(next,500);return}S.results[q.id]=ok?'correct':'wrong';save();document.querySelectorAll('.option').forEach(b=>{b.classList.remove('picked','previous');if(chosen.includes(b.dataset.k))b.classList.add(ok?'good':'bad');if(!ok&&right.includes(b.dataset.k))b.classList.add('reveal');b.disabled=true});flash(ok?'✓ Richtig!':'✕ Falsch',ok?'ok':'no');feedback(q)}function next(){if(S.mode==='exam'&&S.pos>=S.order.length-1)return finishExam();S.pos=(S.pos+1)%S.order.length;save();quiz();scrollTo({top:0,behavior:'smooth'})}function flash(t,c){let s=$('#status');s.textContent=t;s.className='status show '+c;setTimeout(()=>s.className='status',1100)}function startTimer(){let end=S.exam.end;function u(){let left=Math.max(0,end-Date.now()),n=Math.ceil(left/1000);$('#timer').textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;if(left<=0)finishExam()}u();tick=setInterval(u,1000)}function finishExam(){clearInterval(tick);let e=S.exam,p=Math.round(e.correct/e.total*100);S.lastExam={score:p,correct:e.correct,total:e.total,wrongIds:[...new Set(e.wrongIds)]};S.exam=null;S.mode='learn';save();$('#examScore').textContent=p+'%';$('#examVerdict').textContent=`${e.correct} von ${e.total} richtig. ${p>=70?'Bestanden':'Nicht bestanden'}.`;$('#reviewExam').style.display=S.lastExam.wrongIds.length?'block':'none';show('examResult')}function startList(a,m){S.exam=null;S.mode=m;S.order=S.random?shuffle([...a]):[...a];S.pos=0;save();show('quiz')}$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme==='dark'?'dark':'';save()};document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));$('#all').onclick=()=>show('overview');$('#cont').onclick=()=>startList(Q.map((_,i)=>i),'learn');$('#wrong').onclick=()=>{let a=Q.map((q,i)=>S.results[q.id]==='wrong'?i:-1).filter(i=>i>=0);a.length?startList(a,'wrong'):alert('Noch keine falschen Fragen')};$('#favorites').onclick=()=>{let a=S.favs.map(id=>Q.findIndex(q=>q.id===id));a.length?startList(a,'favorites'):alert('Noch keine Fragen gemerkt')};$('#mark').onclick=()=>{let id=cur().id,i=S.favs.indexOf(id);i<0?S.favs.push(id):S.favs.splice(i,1);save();quiz()};$('#examBtn').onclick=()=>show('examSetup');$('#startExam').onclick=()=>{let total=+$('#examCount').value,mins=+$('#examTime').value;S.order=shuffle(Q.map((_,i)=>i)).slice(0,total);S.pos=0;S.mode='exam';S.exam={total,correct:0,wrongIds:[],answers:{},end:Date.now()+mins*60000};save();show('quiz')};$('#reviewExam').onclick=()=>startList(S.lastExam.wrongIds.map(id=>Q.findIndex(q=>q.id===id)),'wrong');$('#random').onchange=e=>{S.random=e.target.checked;save()};$('#next').onclick=next;$('#reset').onclick=()=>{if(confirm('Wirklich gesamten Fortschritt löschen?')){localStorage.removeItem(K);location.reload()}};document.documentElement.dataset.theme=S.theme==='dark'?'dark':'';show('home');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
