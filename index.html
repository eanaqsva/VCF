<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>VCF Trainer</title><style>:root{--b:#f5f7fa;--s:#fff;--t:#172033;--m:#667085;--l:#dfe4ea;--p:#2563eb;--ok:#1463d6;--oks:#e7f0ff;--bad:#d92d20;--bads:#fff0ee}[data-dark]{--b:#111827;--s:#1f2937;--t:#f3f4f6;--m:#a7b0bf;--l:#3b4758;--p:#60a5fa;--ok:#67a8ff;--oks:#18385f;--bad:#ff7b72;--bads:#4a2028}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui}.top{position:sticky;top:0;background:var(--s);border-bottom:1px solid var(--l);padding:14px;display:flex;justify-content:space-between}.wrap{max-width:760px;margin:auto;padding:16px}.view{display:none}.on{display:block}.card,.opt,.btn,.ex{background:var(--s);border:1px solid var(--l);border-radius:16px;padding:14px}.btn{width:100%;min-height:52px;text-align:left;margin:5px 0;color:var(--t)}.primary{background:var(--p);color:#fff;text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{text-align:center}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.tile{aspect-ratio:1;border:1px solid var(--l);background:var(--s);border-radius:12px}.tile.ok{color:var(--ok);background:var(--oks)}.tile.no{color:var(--bad);background:var(--bads)}.opts{display:grid;gap:9px}.opt{text-align:left;min-height:58px;color:var(--t)}.opt.sel{border-color:var(--p)}.opt.good{background:var(--oks);border-color:var(--ok)}.opt.bad{background:var(--bads);border-color:var(--bad)}.key{background:#fde68a;color:#713f12;border-radius:4px;padding:0 3px}.ex{margin-top:12px}.ex h3{color:var(--p);font-size:.85rem}.wrong{border-left:4px solid var(--bad);padding-left:10px;margin:9px 0}.row{display:flex;justify-content:space-between}.muted{color:var(--m)}label{display:flex;justify-content:space-between}.hide{display:none}@media(max-width:420px){.grid{grid-template-columns:repeat(5,1fr)}}</style></head><body><div class="top"><b>VCF Lerntrainer</b><button id="dark">◐</button></div><main class="wrap"><section id="home" class="view on"><h1>Lernfortschritt</h1><div class="stats"><div class="card"><b id="done">0</b><small>bearbeitet</small></div><div class="card"><b id="open">60</b><small>offen</small></div><div class="card"><b id="rate">0%</b><small>richtig</small></div></div><button class="btn primary" id="learn">Weiterlernen</button><button class="btn" id="overviewBtn">Alle Fragen</button><button class="btn" id="wrongBtn">Falsche Fragen wiederholen</button><button class="btn" id="favBtn">Gemerkte Fragen</button><label class="btn"><span>Ausführliche Erklärungen anzeigen</span><input id="showEx" type="checkbox" checked></label><button class="btn" id="reset">Fortschritt zurücksetzen</button></section><section id="overview" class="view"><button class="btn" data-home>‹ Startmenü</button><h1>Alle Fragen</h1><div id="grid" class="grid"></div></section><section id="quiz" class="view"><div class="row"><button data-home>‹ Start</button><span id="count"></span><button id="mark">☆</button></div><h2 id="question"></h2><p class="muted" id="hint"></p><div id="opts" class="opts"></div><div id="explain"></div><button id="next" class="btn primary hide">Nächste Frage</button></section></main><script src="questions.js"></script><script>const Q=VCF_QUESTIONS,K='vcf12',KW=['must','required','prerequisite','before','after','default','minimum','only','without','Choose two','Choose three','Choose four','VCF Installer','SDDC Manager','vSAN','NSX','Kubernetes'];let S=JSON.parse(localStorage.getItem(K)||'null')||{results:{},last:{},favs:[],order:Q.map((_,i)=>i),pos:0,mode:'all',show:true,dark:false},pick=new Set,locked=false;const $=x=>document.querySelector(x),save=()=>localStorage.setItem(K,JSON.stringify(S)),cur=()=>Q[S.order[S.pos]];function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===id));if(id==='home')home();if(id==='overview')over();if(id==='quiz')quiz()}function home(){let v=Object.values(S.results),c=v.filter(x=>x==='c').length;$('#done').textContent=v.length;$('#open').textContent=60-v.length;$('#rate').textContent=(v.length?Math.round(c/v.length*100):0)+'%';$('#showEx').checked=S.show}function over(){$('#grid').innerHTML=Q.map((q,i)=>`<button class="tile ${S.results[q.id]==='c'?'ok':S.results[q.id]==='w'?'no':''}" data-i="${i}">${q.id}</button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{S.order=Q.map((_,i)=>i);S.pos=+b.dataset.i;S.mode='all';show('quiz')})}function hi(t){let h=t;KW.forEach(k=>h=h.replace(new RegExp('('+k+')','gi'),'<mark class="key">$1</mark>'));return h}function quiz(){locked=false;pick.clear();let q=cur();$('#count').textContent=S.mode==='wrong'?`Falsch ${S.pos+1}/${S.order.length}`:`Frage ${q.id}/60`;$('#question').innerHTML=hi(q.question);$('#hint').textContent=q.answers.length+' Antwort(en) auswählen';$('#opts').innerHTML=Object.entries(q.options).map(([k,v])=>`<button class="opt" data-k="${k}"><b>${k}</b> ${v}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>tap(b));$('#explain').innerHTML='';$('#next').classList.add('hide');$('#mark').textContent=S.favs.includes(q.id)?'★':'☆'}function tap(b){if(locked)return;let q=cur(),k=b.dataset.k;if(pick.has(k)){pick.delete(k);b.classList.remove('sel')}else{pick.add(k);b.classList.add('sel')}if(pick.size===q.answers.length)grade()}function grade(){locked=true;let q=cur(),a=[...pick].sort(),r=[...q.answers].sort(),ok=JSON.stringify(a)===JSON.stringify(r);S.results[q.id]=ok?'c':'w';S.last[q.id]=a;save();document.querySelectorAll('.opt').forEach(b=>{if(a.includes(b.dataset.k))b.classList.add(ok?'good':'bad');if(!ok&&r.includes(b.dataset.k))b.classList.add('good');b.disabled=true});if(S.show){let wrong=Object.entries(q.wrongReasons).map(([k,v])=>`<div class="wrong"><b>${k}) ${q.options[k]}</b><p>${v}</p></div>`).join('');$('#explain').innerHTML=`<div class="ex"><h3>✓ Richtige Antwort</h3><p>${q.answers.map(k=>k+') '+q.options[k]).join('<br>')}</p></div><div class="ex"><h3>Deutsche Erklärung</h3><p>${q.deExplanation}</p></div><div class="ex"><h3>Prüfungstipp</h3><p>${q.examTip}</p></div><details class="ex"><summary>Warum die anderen Antworten falsch sind</summary>${wrong}</details><details class="ex"><summary>Englische Originalerklärung</summary><p>${q.explanation}</p></details>`;$('#next').classList.remove('hide')}else setTimeout(next,ok?2200:3000)}function next(){S.pos=(S.pos+1)%S.order.length;save();quiz();scrollTo(0,0)}function list(idx,m){S.order=idx;S.pos=0;S.mode=m;show('quiz')}$('#learn').onclick=()=>list(Q.map((_,i)=>i),'all');$('#overviewBtn').onclick=()=>show('overview');$('#wrongBtn').onclick=()=>{let a=Q.map((q,i)=>S.results[q.id]==='w'?i:-1).filter(i=>i>=0);a.length?list(a,'wrong'):alert('Keine falschen Fragen')};$('#favBtn').onclick=()=>{let a=S.favs.map(id=>Q.findIndex(q=>q.id===id));a.length?list(a,'fav'):alert('Keine gemerkten Fragen')};$('#mark').onclick=()=>{let id=cur().id,i=S.favs.indexOf(id);i<0?S.favs.push(id):S.favs.splice(i,1);save();quiz()};$('#showEx').onchange=e=>{S.show=e.target.checked;save()};$('#next').onclick=next;$('#reset').onclick=()=>{if(confirm('Fortschritt löschen?')){localStorage.removeItem(K);location.reload()}};$('#dark').onclick=()=>{S.dark=!S.dark;document.documentElement.toggleAttribute('data-dark',S.dark);save()};document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));document.documentElement.toggleAttribute('data-dark',S.dark);show('home');</script></body></html>
